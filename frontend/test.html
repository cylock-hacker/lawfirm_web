<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p class="testing">Hello, World!</p>
        <p class="testing">dom testing</p>
        <button onclick="testing()">click me</button>
        <button onclick="testing2()">click me too</button>
        <button onclick="testing3()">click me three</button>
    </div>
</body>
<script>
    function testing(){
        const elements = document.querySelectorAll('.testing');
        elements.forEach(element => {
            element.style.color = 'red';
        });
    }

    function testing2(){
        const elements = document.querySelectorAll('.testing');
        elements.forEach(element => {
            element.style.fontSize = '20px';
        });
    }

    function testing3(){
        const elements = document.querySelectorAll('.testing');
        elements.forEach(element => {
            element.style.backgroundColor = 'yellow';
        });
    }
    const arrowfunction = () =>{return "this is an arrow function"};
    document.querySelector('button').addEventListener('click', () => {
        console.log(arrowfunction());
    });
   
</script>
</html>
